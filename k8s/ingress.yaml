apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-ingress
  namespace: notes-app
spec:
  ingressClassName: nginx
  tls:
    - hosts: [notes.127.0.0.1.nip.io]
      secretName: notes-tls
  rules:
    - host: notes.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notes-app
                port:
                  number: 80
